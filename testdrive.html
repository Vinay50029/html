<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style1.css">
    <link
     rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bulma@1.0.1/css/bulma.min.css"
    >
    <title>driving experience</title>
</head>
<body>
  <section class="mainpic">
    <div>
        <div class="tabs is-medium">
            <ul>
                <li><a href="index.html" target="_blank"><button><strong>HOME</strong></button></a></li>
                
                <li><a href="index.html"><button><strong>CONTACT US</strong></button></a></li>
                <li><a href="https://www.bmw.in/en/index.html" target="_blank"><button><img height="75" width="75" class="hd2" src="headinglogo3.png" alt="hd2"></button></a></li>
                <li><a href="https://www.bmw-m.com/en/topics/magazine-article-pool/die-geschichte-des-bmw-m-logos.html" target="_blank"><button><img height="90" width="90" class="hd3" src="headinglogo4.png" alt="hd3"></button></a></li>
            </ul>
        </div>
        <img class="pic" src="loginfirst.jpg" alt="begginer">
    </div>
</section>

        <section class="video">
            <div class="mainheading"><h1 class="heading">THE BMW M DRIVING EXPERIENCE</h1></div>
            <iframe id="bmw-video" height="855" width="1790" src="https://bmw.scene7.com/is/content/BMW/BMW_M_Driving_Experience_Angebot_V1?autoplay=1&loop=1&muted=1" frameborder="0"  allow="autoplay;loop"></iframe>
        </section>
        
        <section class="form">
            <div class="field">
                <label class="label">Name</label>
                <div class="control has-icons-left has-icons-right">
                  <input class="input is-white" type="text" placeholder="USER NAME">
                </div>
              </div>
              
              <div class="field">
                <label class="label">Phone</label>
                <div class="control has-icons-left has-icons-right">
                  <input class="input is-white" type="number" placeholder="PHONE NUMBER">
                  <span class="icon is-small is-left">
                    <i class="fas fa-user"></i>
                  </span>
                  <span class="icon is-small is-right">
                    <i class="fas fa-check"></i>
                  </span>
                </div>
                <!-- <p class="help is-success">This is available</p> -->
              </div>
              
              <div class="field">
                <label class="label">Email</label>
                <div class="control has-icons-left has-icons-right">
                  <input class="input is-white" type="email" placeholder="Email input" value="@gmail.com">
                  <span class="icon is-small is-left">
                    <i class="fas fa-envelope"></i>
                  </span>
                  <span class="icon is-small is-right">
                    <i class="fas fa-exclamation-triangle"></i>
                  </span>
                </div>
                <!-- <p class="help is-danger">This email is valid</p> -->
              </div>
              
              <div class="field">
                <label class="label">driving licence </label>
                <div class="control has-icons-left has-icons-right">
                  <input class="input is-white" type="email" placeholder="ID" >
                  <span class="icon is-small is-left">
                  </span>
                  <span class="icon is-small is-right">
                  </span>
                </div>
                <!-- <p class="help is-danger">This email is valid</p> -->
              </div>

              <div class="field">
                <label class="label">aadhaar number </label>
                <div class="control has-icons-left has-icons-right">
                  <input class="input is-white" type="number" placeholder="____ ____ ____">
                  <span class="icon is-small is-left">
                    <i class="fas fa-user"></i>
                  </span>
                  <span class="icon is-small is-right">
                    <i class="fas fa-check"></i>
                  </span>
                </div>
                <!-- <p class="help is-success">This is available</p> -->
              </div>

              <div class="field">
                <label class="label">gender</label>
                <div class="control">
                  <div class="select is-white">
                    <select>
                      <option>male</option>
                      <option>female</option>
                      <option>other</option>
                    </select>
                  </div>
                </div>
              </div>
              
              <div class="field">
                <label class="label"> address</label>
                <div class="control">
                  <textarea class="textarea is-white" placeholder="house no.,area,street no.,district,state." rows="2"></textarea>
                </div>
              </div>
              
              <div class="field">
                <div class="control">
                  <label class="checkbox">
                    <input type="checkbox">
                    I agree to the <a href="#">terms and conditions</a>
                  </label>
                </div>
              </div>
              
              
              <div class="field is-grouped">
                <div class="control ">
                  <button class="button is-link ">Submit</button>
                </div>
                <div class="control">
                  <button class="button is-link">Cancel</button>
                </div>
              </div>
        </section>

        <section class="end">
            <div class="container">
                <p>&copy; 2024 Luxury and Performance: The Legacy of BMW Group</p>
                <ul>
                    <li><a href="#">Privacy Policy</a></li>
                    <li><a href="#">Terms of Service</a></li>
                </ul>
            </div>
       </section>
       <script>
       document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) || (e.ctrlKey && (e.key === 'U' || e.key === 'u'))) {
          e.preventDefault();
        }
      });
    </script>
</body>
</html>
